{% extends 'base.html' %}

{% block content %}
<h1>Подтверждение удаления</h1>
<p>Вы уверены, что хотите удалить запись "{{ note.title }}"?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Удалить</button>
    <a href="{% url 'notes:detail' note.pk %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
