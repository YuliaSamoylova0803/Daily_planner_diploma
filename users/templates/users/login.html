{% extends "users/base_auth.html" %}
{% load static %}

{% block title%}Регистрация{% endblock %}

{% block content %}
<div class="container mt-5">

    <div class="row mb-5">
        <div class="col-md-6 offset-md-3">
            <div class="card">
                <div class="card-header btn btn-mint text-white">
                    <h5>Вход на сайт</h5>
                </div>
                <div class="card-body">
                    <form method="post" enctype="multipart/form-data">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <button type="submit" class="btn btn btn-primary">Войти</button>
                        <a class="btn btn-outline-dark me-2" href="#" role="button">Не
                            авториризоваться</a>
                       <a class="btn btn-link" href="{% url 'users:password_reset' %}" role="button">Забыли пароль?</a>
                    </form>
                </div>
            </div>
        </div>
    </div>

{% endblock %}
