services:
  db:
    image: postgres:14.1-alpine
    environment:
        POSTGRES_DB: ${DB_NAME}
        POSTGRES_USER: ${DB_USER}
        POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-daily_planner}"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:6-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      args:
        DJANGO_ENV: ${DJANGO_ENV:-development}
    command: >
      bash -c "python manage.py migrate &&
      python manage.py collectstatic --noinput &&
      python manage.py runserver 0.0.0.0:8000"
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
#    ports:
#      - "8000:8000"
#    volumes:
#      - ./static:/app/static  # Для разработки (STATICFILES_DIRS)
#      - static_volume:/app/staticfiles  # Для production (STATIC_ROOT)
#      - ./media:/app/media
#      - .:/app


  web:
    image: nginx:1.19.3-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./static:/usr/share/nginx/html/static  # Только production статика
      - ./media:/usr/share/nginx/html/media
    depends_on:
      backend:
        condition: service_healthy


volumes:
  pg_data:
  static:
  media:
